<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tweet Search</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .tweet-card {
            transition: transform 0.2s ease-in-out;
        }
        .tweet-card:hover {
            transform: translateY(-2px);
        }
        .loading {
            display: none;
        }
        .loading.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">Tweet Search</h1>
            
            <!-- Search Form -->
            <div class="mb-8">
                <div class="relative">
                    <input type="text" 
                           id="searchInput"
                           class="w-full px-4 py-3 rounded-lg shadow-sm border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                           placeholder="Search tweets...">
                    <div id="loading" class="loading absolute right-4 top-3">
                        <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Results Container -->
            <div id="results" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('results');
        const loadingIndicator = document.getElementById('loading');
        let searchTimeout;

        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();
            
            if (query.length < 2) {
                resultsContainer.innerHTML = '';
                return;
            }

            loadingIndicator.classList.add('active');
            
            searchTimeout = setTimeout(() => {
                fetch(`/search?q=${encodeURIComponent(query)}`)
                    .then(response => response.json())
                    .then(results => {
                        console.log("Raw results from backend:", results);
                        resultsContainer.innerHTML = '';
                        results.forEach(tweet => {
                            
                            const card = document.createElement('div');
                            card.className = 'tweet-card bg-white rounded-lg shadow-md p-6 hover:shadow-lg';
                            
                            const score = Math.round(tweet.score * 100);
                            
                            card.innerHTML = `
                                <div class="flex justify-between items-start">
                                    <div class="flex-1">
                                        <p class="text-gray-800 text-lg">${tweet.text}</p>
                                        <div class="mt-4 flex items-center text-sm text-gray-600">
                                            <span class="mr-4">ID: ${tweet.id}</span>
                                            <span class="mr-4">Relevance: ${score}%</span>
                                            ${tweet.x_url ? `<a href="${tweet.x_url}" target="_blank" class="text-blue-500 hover:text-blue-700">View on X</a>` : ''}
                                        </div>
                                    </div>
                                </div>
                            `;
                            
                            resultsContainer.appendChild(card);
                        });
                    })
                    .catch(error => {
                        console.error('Search error:', error);
                        resultsContainer.innerHTML = '<div class="text-red-500">An error occurred while searching</div>';
                    })
                    .finally(() => {
                        loadingIndicator.classList.remove('active');
                    });
            }, 300);
        });
    </script>
</body>
</html>
